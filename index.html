<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title>7OLLA Store</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <div id="toast" class="toast">
  ✓ Produit ajouté au panier
</div>
  <body>
    <header>
      <a class="logo.jpeg" href="index.html">
  <img src="images/logo.jpeg" alt="7OLLA Store">
<br>7OLLA STORE</a>

      <button class="cart-button" onclick="toggleCart()">
        🛒 Panier
        <span id="cartCount">0</span>
      </button>
    </header>

    <section class="hero">
      <div>
        <span class="small">7OLLA STORE • TUNISIE</span>

        

        <p>Accessoires</p>

        <a href="#products" class="primary"> Voir les produits </a>
      </div>
    </section>

    <main>
      <section class="section" id="products">
        <div class="title">
          <h2>Nos produits</h2>
          <p>Découvrez notre collection.</p>
        </div>

        <div class="tools">
          <input id="search" placeholder="Rechercher..." />

          <select id="category">
            <option value="">Toutes les catégories</option>
          </select>
        </div>

        <div id="productGrid" class="grid">Chargement...</div>
      </section>
    </main>

    <aside id="cart" class="cart">
      <div class="cart-head">
        <h2>Panier</h2>
        <button onclick="toggleCart()">✕</button>
      </div>

      <div id="cartItems"></div>

      <div class="cart-bottom">
        <div class="cart-summary">

  <div class="cart-summary-line">
    <span>Sous-total</span>
    <strong id="cartSubtotal">0 DT</strong>
  </div>

  <div class="cart-summary-line">
    <span>🚚 Livraison</span>
    <strong>8 DT</strong>
  </div>

  <div class="total">
    <span>Total estimé</span>
    <strong id="cartTotal">0 DT</strong>
  </div>

</div>

        <a href="checkout.html" class="checkout-btn"> Commander </a>
      </div>
    </aside>

    <div id="overlay" class="overlay" onclick="toggleCart()"></div>

    <footer>
      <strong>7OLLA STORE</strong>

      <p>Accessoires • Tunisie 🇹🇳</p>

      <small>© 2026 7OLLA Store</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/store.js"></script>
  </body>
</html>
